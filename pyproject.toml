[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voyager"
version = "0.0.0"
description = "A multi-agent RL survival economy environment with a web-demoable replay layer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "gymnasium",
  "pettingzoo",
  "pydantic",
  "fastapi",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy",
]

[tool.setuptools.packages.find]
include = ["voyager*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
packages = ["voyager"]
ignore_missing_imports = true
